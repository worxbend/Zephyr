name: Publish released Snaps to the Snap Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release containing both validated Snap assets
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      SNAPCRAFT_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-snap-store-zephyr-latest-stable
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate publication tag
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'packaging')
          from release import require, version_value
          tag = os.environ['RELEASE_TAG']
          require(tag.startswith('v'), 'Release tag must start with v')
          version_value(tag[1:])
          PY
      - name: Download released Snap and checksum
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == false ]]
          asset="Zephyr-${RELEASE_TAG#v}-linux-$ARCH.snap"
          mkdir -p release
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --pattern "$asset" --dir release
          printf 'snap_path=release/%s\n' "$asset" >> "$GITHUB_OUTPUT"
      - name: Install Snap inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools
      - name: Verify released bytes, metadata and native architecture
        env:
          SNAP_PATH: ${{ steps.download.outputs.snap_path }}
        run: |
          python3 packaging/release.py artifact "$SNAP_PATH" --version "${RELEASE_TAG#v}" \
            --arch "$ARCH" --format snap --checksums release/SHA256SUMS
      - name: Refuse an older release than the current stable channel
        env:
          SNAP_PATH: ${{ steps.download.outputs.snap_path }}
        run: python3 packaging/verify_snap_store.py --before-publish --version "${RELEASE_TAG#v}" --arch "$ARCH" --snap-path "$SNAP_PATH"
      - name: Publish released Snap to stable
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        with:
          snap: ${{ steps.download.outputs.snap_path }}
          release: stable
      - name: Read back public stable channel
        env:
          SNAP_PATH: ${{ steps.download.outputs.snap_path }}
        run: python3 packaging/verify_snap_store.py --version "${RELEASE_TAG#v}" --arch "$ARCH" --snap-path "$SNAP_PATH"