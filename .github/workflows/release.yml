name: Release Linux distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: linux-distributions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release version and packaging contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version and tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=(--tag "$RELEASE_TAG"); fi
          version=$(python3 packaging/release.py source "${args[@]}")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Test packaging contracts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-yaml
          python3 -m unittest discover -s packaging -p 'test_*.py' -v
          python3 -m unittest discover -s packaging/flatpak -p 'test_*.py' -v
          /usr/bin/python3 -m unittest discover -s packaging/snap -p 'test_*.py' -v

  build:
    name: Test and build native image (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the pinned JDK vendor
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: corretto
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run tests and build bundled JVM application
        run: ./gradlew check :desktopApp:createDistributable --console=plain
      - name: Preserve executable bits and symlinks
        run: tar -C desktopApp/build/compose/binaries/main/app -czf "$RUNNER_TEMP/native-image.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package ${{ matrix.format }} (${{ matrix.arch }})
    needs: [metadata, build]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        format: [AppImage, flatpak, snap]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      ZEPHYR_SKIP_GRADLE_BUILD: "1"
      VERSION: ${{ needs.metadata.outputs.version }}
      ARCH: ${{ matrix.arch }}
      FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-image
      - name: Restore native application
        run: |
          mkdir -p desktopApp/build/compose/binaries/main/app
          tar -C desktopApp/build/compose/binaries/main/app -xzf "$RUNNER_TEMP/native-image/native-image.tar.gz"
      - name: Install packaging and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools flatpak ostree appstream python3-yaml
          if [[ "$FORMAT" == flatpak ]]; then
            sudo apt-get install --yes --no-install-recommends elfutils flatpak-builder
          fi
      - name: Build package
        run: |
          case "$FORMAT" in
            AppImage) packaging/appimage/build-appimage.sh ;;
            flatpak) packaging/flatpak/build-flatpak.sh ;;
            snap) packaging/snap/build-snap.sh ;;
            *) exit 1 ;;
          esac
      - name: Inspect package identity, version and actual ELF architecture
        run: |
          python3 packaging/release.py artifact "dist/Zephyr-$VERSION-linux-$ARCH.$FORMAT" \
            --version "$VERSION" --arch "$ARCH" --format "$FORMAT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}-${{ matrix.format }}
          path: dist/Zephyr-${{ env.VERSION }}-linux-${{ matrix.arch }}.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Require all six distributions
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Install non-executing package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools flatpak ostree
      - name: Validate complete matrix and create checksums
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 packaging/release.py manifest release --version "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    name: Publish complete GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release-bundle
          path: release
      - name: Stage assets, read them back, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$draft" == true ]] || { echo 'Refusing to overwrite an already published release.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Zephyr ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-readback"
          python3 - <<'PY'
          import os
          from pathlib import Path
          expected = {p.name for p in Path('release').iterdir()}
          actual = {p.name for p in (Path(os.environ['RUNNER_TEMP']) / 'release-readback').iterdir()}
          if actual != expected:
              raise SystemExit(f'Remote release asset mismatch: {actual ^ expected}')
          PY
          cmp release/SHA256SUMS "$RUNNER_TEMP/release-readback/SHA256SUMS"
          cmp release/BUILD-MANIFEST.txt "$RUNNER_TEMP/release-readback/BUILD-MANIFEST.txt"
          (cd "$RUNNER_TEMP/release-readback" && sha256sum --check "$GITHUB_WORKSPACE/release/SHA256SUMS")
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == false ]]
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  publish-snap-store:
    name: Publish released Snaps
    needs: publish-github-release
    uses: ./.github/workflows/publish-snap-store.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      SNAPCRAFT_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN }}