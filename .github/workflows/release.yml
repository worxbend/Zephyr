name: Release Linux distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run tests
        run: ./gradlew check --console=plain

  package-linux:
    name: AppImage and Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build AppImage
        id: appimage
        continue-on-error: true
        run: packaging/appimage/build-appimage.sh

      - name: Install Flatpak
        id: flatpak-tools
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            elfutils \
            flatpak \
            flatpak-builder

      - name: Build Flatpak bundle
        id: flatpak
        if: steps.flatpak-tools.outcome == 'success'
        continue-on-error: true
        run: packaging/flatpak/build-flatpak.sh

      - name: Report package outcomes
        if: always()
        run: |
          echo "AppImage: ${{ steps.appimage.outcome }}"
          echo "Flatpak: ${{ steps.flatpak.outcome }}"

      - name: Upload successful Linux packages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14

  package-snap:
    name: Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: true
    env:
      STORE_LOGIN: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Snap
        id: snapcraft
        continue-on-error: true
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79

      - name: Validate Snap metadata
        id: snap-validate
        if: steps.snapcraft.outcome == 'success'
        continue-on-error: true
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          if ! command -v unsquashfs >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends squashfs-tools
          fi

          version=$(sed -n 's/^zephyrVersion=//p' gradle.properties)
          case "$(basename "$SNAP_PATH")" in
            "zephyr-sdkman_${version}_${EXPECTED_ARCH}.snap") ;;
            *)
              echo "Unexpected Snap artifact name: $SNAP_PATH" >&2
              exit 1
              ;;
          esac

          metadata=$(unsquashfs -cat "$SNAP_PATH" meta/snap.yaml)
          grep -Fxq "name: zephyr-sdkman" <<<"$metadata"
          grep -Fxq "version: $version" <<<"$metadata"
          grep -Fxq "confinement: classic" <<<"$metadata"
          grep -Fxq "grade: stable" <<<"$metadata"
          grep -Fxq -- "- $EXPECTED_ARCH" <<<"$metadata"

          listing=$(mktemp)
          unsquashfs -ll "$SNAP_PATH" > "$listing"
          grep -Fq "meta/gui/zephyr.desktop" "$listing"
          grep -Fq "usr/share/applications/com.worxbend.zephyr.desktop" "$listing"
          grep -Fq "usr/lib/zephyr/bin/com.worxbend.zephyr" "$listing"

      - name: Normalize Snap artifact name
        if: steps.snapcraft.outcome == 'success' && steps.snap-validate.outcome == 'success'
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          version=$(sed -n 's/^zephyrVersion=//p' gradle.properties)
          mkdir -p dist
          cp "$SNAP_PATH" "dist/Zephyr-$version-linux-${{ matrix.arch }}.snap"

      - name: Publish Snap to stable
        id: publish
        if: github.ref_type == 'tag' && steps.snapcraft.outcome == 'success' && steps.snap-validate.outcome == 'success' && env.STORE_LOGIN != ''
        continue-on-error: true
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ env.STORE_LOGIN }}
        uses: snapcore/action-publish@9334eecb267cfd97a0ce3c8654215d095927252f # v1.2.0
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable

      - name: Report Snap outcome
        if: always()
        run: |
          echo "Snap build: ${{ steps.snapcraft.outcome }}"
          echo "Snap validation: ${{ steps.snap-validate.outcome }}"
          echo "Snap Store publish: ${{ steps.publish.outcome }}"
          if [[ -z "$STORE_LOGIN" ]]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS is not configured; store publishing was skipped."
          fi

      - name: Upload successful Snap
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-snap-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: ignore
          retention-days: 14

  publish-github-release:
    name: Publish available packages
    if: always() && github.ref_type == 'tag'
    needs:
      - verify
      - package-linux
      - package-snap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download every successful package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Require at least one distribution
        run: |
          package_count=$(find release -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.flatpak' -o -name '*.snap' \) \
            | wc -l)
          if [[ "$package_count" -eq 0 ]]; then
            echo "No AppImage, Flatpak, or Snap package was built." >&2
            exit 1
          fi
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create checksums and build manifest
        working-directory: release
        run: |
          find . -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.flatpak' -o -name '*.snap' \) \
            -printf '%f\n' | sort > BUILD-MANIFEST.txt
          while IFS= read -r package; do
            sha256sum "$package"
          done < BUILD-MANIFEST.txt > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --verify-tag \
              --title "Zephyr ${RELEASE_TAG#v}" \
              --generate-notes
          fi
