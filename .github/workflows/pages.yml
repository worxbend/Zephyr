name: Publish microsite

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build_site.py"
      - "tools/test_site_build.py"
      - "Screenshot-*.png"
      - "packaging/linux/com.worxbend.zephyr.png"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/build_site.py"
      - "tools/test_site_build.py"
      - "Screenshot-*.png"
      - "packaging/linux/com.worxbend.zephyr.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Releases created by GITHUB_TOKEN do not emit another workflow's release
  # event. Refresh after the release pipeline finishes instead; only actual
  # published assets are advertised, even if a Store upload failed afterward.
  workflow_run:
    workflows: ["Release Linux distributions"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build static microsite
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check release-aware site builder
        run: python3 -B -m unittest discover -s tools -p 'test_site_build.py' -v
      - name: Read the latest published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/worxbend/Zephyr/releases/latest \
            --jq '{tag_name,html_url,draft,prerelease,assets: [.assets[] | {name,browser_download_url,size}]}' \
            > "$RUNNER_TEMP/site-release.json"
          python3 -B tools/build_site.py --release-json "$RUNNER_TEMP/site-release.json" --source-sha "$(git rev-parse HEAD)"
      - name: Install browser test tools
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test responsive layout, interactions and accessibility
        working-directory: site
        run: npm test
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microsite-test-evidence
          path: |
            build/site-test-report/
            build/site-test-results/
          if-no-files-found: ignore
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
