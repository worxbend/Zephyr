# Prerequisite: build :desktopApp:createDistributable with native Corretto 21.
# packaging/snap/build-snap.sh isolates this prebuilt image in a core24 builder.
# Direct `snapcraft pack --use-lxd` also needs that image present beforehand.
# No JDK is installed here: Gradle's daemon requires AMAZON, not Ubuntu OpenJDK.
name: zephyr
title: Zephyr
summary: Manage Java and SDKMAN toolchains from your Linux desktop
description: |
  Browse, install, switch, and clean up Java development kits and SDKs with
  Zephyr, a Linux desktop interface for SDKMAN. Work with your existing SDKMAN
  installation instead of maintaining a separate set of development tools.

  Find local-only versions that are still installed but no longer appear in
  SDKMAN's catalog. Review removals before they run, with protection for your
  current defaults and pinned versions.

  What you can do:
  - Browse JDKs by vendor and version, and discover SDKMAN SDKs and build tools.
  - Install and uninstall versions, set defaults, and review updates in one place.
  - Preview SDKMAN commands before confirming changes, including batch operations.
  - Save toolchain profiles, import and export .sdkmanrc files, and review
    environment snapshots before restoring installed versions and defaults.
  - Search pages, versions, and actions with Ctrl+K or open the command palette
    with Ctrl+Shift+P.
  - Inspect diagnostics and operation history, and export support information.
  - Choose light or dark appearance, compact or comfortable layouts, larger
    text up to 200%, and reduced motion.

  Getting started:
  Install SDKMAN for your user account first: https://sdkman.io/install
  Then open Zephyr from your applications menu or run zephyr in a terminal.
  Zephyr discovers SDKMAN through SDKMAN_DIR or ~/.sdkman. For a custom
  location, select your SDKMAN home in Settings and restart Zephyr.

  A Java runtime is included; you do not need to install Java to open Zephyr.
  Internet access is required to refresh the catalog and download toolchains.
  Previously cached catalog information remains available offline. Opening an
  activated shell requires a supported terminal emulator installed on the host.

  Permissions:
  This snap uses classic confinement to manage your existing SDKMAN files,
  execute SDKMAN commands, and open host terminals. It is not restricted by
  the usual strict Snap sandbox. Review each proposed toolchain change before
  confirming it.

  Zephyr is a graphical frontend to SDKMAN, not a replacement package manager.
  Source code, documentation, and bug reports:
  https://github.com/worxbend/Zephyr
adopt-info: zephyr
license: MIT
website: https://github.com/worxbend/Zephyr
source-code: https://github.com/worxbend/Zephyr
issues: https://github.com/worxbend/Zephyr/issues
contact: https://github.com/worxbend/Zephyr/issues
icon: packaging/linux/com.worxbend.zephyr.png
base: core24
grade: stable
confinement: classic
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  zephyr:
    command: usr/lib/zephyr/bin/com.worxbend.zephyr
    desktop: usr/share/applications/com.worxbend.zephyr.desktop
    common-id: com.worxbend.zephyr
    environment:
      FONTCONFIG_PATH: $SNAP/etc/fonts
      FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf
      LIBGL_DRIVERS_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri

parts:
  zephyr:
    plugin: dump
    source: desktopApp/build/compose/binaries/main/app/com.worxbend.zephyr
    source-type: local
    organize:
      bin: usr/lib/zephyr/bin
      lib: usr/lib/zephyr/lib
    build-attributes:
      - enable-patchelf
    override-pull: |
      craftctl default
      version=$(sed -n 's/^zephyrVersion=//p' "$CRAFT_PROJECT_DIR/gradle.properties")
      test -n "$version"
      craftctl set version="$version"

  runtime-dependencies:
    plugin: nil
    build-attributes:
      - enable-patchelf
    # Snapcraft resolves and records the transitive Ubuntu 24.04 dependencies.
    # Do not replace this with copying host libraries or an unchecked squashfs.
    stage-packages:
      - libasound2t64
      - libfontconfig1
      - libfreetype6
      - libgl1
      - libegl1
      - libglx-mesa0
      - libgl1-mesa-dri
      # LLVM uses RUNPATH (not inherited by libedit's dependencies). Stage and
      # patch libedit too, otherwise it can load incompatible host libraries.
      - libedit2
      - libx11-6
      - libxext6
      - libxi6
      - libxrender1
      - libxtst6
      - fonts-dejavu-core
    override-build: |
      craftctl default
      # Keep host/user fonts available under classic, but always supply a
      # fallback from the snap even on minimal machines with no system fonts.
      sed -i 's#<dir>/usr/share/fonts</dir>#<dir prefix="relative">../../usr/share/fonts</dir>\n\t<dir>/usr/share/fonts</dir>#' \
        "$CRAFT_PART_INSTALL/etc/fonts/fonts.conf"

  desktop-integration:
    plugin: nil
    source: packaging/linux
    source-type: local
    override-build: |
      install -d \
        "$CRAFT_PART_INSTALL/usr/share/applications" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo"
      install -m 0644 "$CRAFT_PART_SRC/com.worxbend.zephyr.desktop" \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.worxbend.zephyr.desktop"
      sed -i 's/^Exec=.*/Exec=zephyr/' \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.worxbend.zephyr.desktop"
      sed -i 's#^Icon=.*#Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/com.worxbend.zephyr.svg#' \
        "$CRAFT_PART_INSTALL/usr/share/applications/com.worxbend.zephyr.desktop"
      install -m 0644 "$CRAFT_PART_SRC/com.worxbend.zephyr.svg" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/com.worxbend.zephyr.svg"
      install -m 0644 "$CRAFT_PART_SRC/com.worxbend.zephyr.metainfo.xml" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/com.worxbend.zephyr.metainfo.xml"
