id: com.worxbend.zephyr
default-branch: master
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: zephyr
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # SDKMAN data lives in the user's home. Keep the host-spawn permission, but
  # permission alone does not make the current JVM backend execute on the host.
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
modules:
  - name: zephyr
    buildsystem: simple
    # This release bundle repackages the native Compose image, not a Flathub
    # source build. Preserve the supplied JVM/native binaries unchanged.
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - install -d /app/lib/zephyr /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/metainfo
      - cp -a app/. /app/lib/zephyr/
      - install -m 0755 flatpak-launcher /app/bin/zephyr
      - install -m 0644 com.worxbend.zephyr.desktop /app/share/applications/com.worxbend.zephyr.desktop
      - install -m 0644 com.worxbend.zephyr.png /app/share/icons/hicolor/512x512/apps/com.worxbend.zephyr.png
      - install -m 0644 com.worxbend.zephyr.metainfo.xml /app/share/metainfo/com.worxbend.zephyr.metainfo.xml
    sources:
      - type: dir
        path: ../../desktopApp/build/compose/binaries/main/app/com.worxbend.zephyr
        dest: app
      - type: file
        path: flatpak-launcher
      - type: file
        path: ../linux/com.worxbend.zephyr.desktop
      - type: file
        path: ../linux/com.worxbend.zephyr.png
      - type: file
        path: ../linux/com.worxbend.zephyr.metainfo.xml
